<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Leaderboard — Brave New World</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" /><link rel="stylesheet" href="styles.css" /></head>
<body><main class="app-shell"><header class="site-header"><a class="brand" href="index.html">BRAVE <em>NEW</em> WORLD</a><a class="leaderboard-link" href="index.html">← Return to puzzle</a></header><section class="leaderboard-screen standalone active"><div class="leaderboard-heading"><div><p class="eyebrow">THE ARCHIVE</p><h2>Fastest<br /><em>assemblies.</em></h2></div></div><div class="leaderboard-table"><div class="table-head"><span>RANK</span><span>PLAYER</span><span>TIME</span><span>POINTS</span></div><div id="leaderboardRows"></div></div></section></main><script>const scores=JSON.parse(localStorage.getItem('brave-new-world-scores')||'[]');const time=v=>`${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`;const escape=v=>{const n=document.createElement('div');n.textContent=v;return n.innerHTML};document.querySelector('#leaderboardRows').innerHTML=scores.length?scores.map((s,i)=>`<div class="leaderboard-row"><span class="rank">${String(i+1).padStart(2,'0')}</span><strong>${escape(s.name)}</strong><span class="time">${time(s.seconds)}</span><span>${s.points}</span></div>`).join(''):'<p class="empty-row">No completed assemblies yet. Be the first to enter the archive.</p>';</script></body></html>
