<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Word Challenge — Brave New World</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" /><link rel="stylesheet" href="styles.css" /></head>
<body><main class="app-shell wordle-shell"><header class="site-header"><span class="brand">BRAVE <em>NEW</em> WORLD</span><span class="eyebrow">WORD CHALLENGE</span></header><section class="wordle-entry" id="wordleEntry"><p class="eyebrow">IDENTIFICATION REQUIRED</p><h1>Find the<br /><em>hidden word.</em></h1><p class="lede">Enter your CC code before beginning. Your first completed result is permanent.</p><form id="ccForm" class="cc-form"><input id="ccCode" required maxlength="32" placeholder="Enter your CC code" autocomplete="off" /><button class="primary-button" type="submit">Start challenge <span>→</span></button></form></section><section class="wordle-game" id="wordleGame" hidden><div class="wordle-meta"><p class="eyebrow">CC CODE: <strong id="ccDisplay"></strong></p><p class="eyebrow">ATTEMPT <strong id="attemptDisplay">1 / 6</strong></p></div><div class="word-grid" id="wordGrid" aria-label="Word puzzle"></div><div class="word-keyboard" id="keyboard"></div><p class="word-status" id="wordStatus">Type a five-letter word.</p></section><section class="wordle-result" id="wordleResult" hidden><p class="eyebrow">CHALLENGE COMPLETE</p><h2 id="resultHeading">First result<br /><em>recorded.</em></h2><p class="result-note" id="resultNote"></p><div class="result-stats"><div><span>CC CODE</span><strong id="resultCode"></strong></div><div><span>ATTEMPTS</span><strong id="resultAttempts"></strong></div></div></section></main><script src="config.js"></script><script src="wordle.js"></script></body></html>
